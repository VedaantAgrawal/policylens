[project]
name = "policylens"
version = "0.1.0"
description = "Agentic RAG over insurance and regulatory documents, with a measured retrieval ablation as the centerpiece deliverable."
authors = [
    { name = "VedaantAgrawal", email = "vedaantagrawal17@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.120.2",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.1",
    "numpy>=2.5.1",
    "pydantic>=2.13.4",
    "pypdf>=6.14.2",
    "python-dotenv>=1.2.2",
    "rank-bm25>=0.2.2",
    "requests>=2.34.2",
    "sentence-transformers>=5.6.1",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
